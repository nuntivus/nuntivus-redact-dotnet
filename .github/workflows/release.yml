name: Prepare packages (no publishing)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: ./tools/verification/verify.ps1
        shell: pwsh
      - run: ./tools/verification/package-smoke.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-packages
          path: artifacts/packages/
