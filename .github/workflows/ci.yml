name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: ./tools/verification/verify.ps1
        shell: pwsh
      - run: ./tools/verification/verify.ps1 format-check
        shell: pwsh
      - run: ./tools/verification/docs-check.ps1
        shell: pwsh
      - run: ./tools/verification/package-smoke.ps1
        shell: pwsh
      - run: ./tools/verification/ocr-smoke.ps1
        if: runner.os == 'Windows'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: artifacts/
